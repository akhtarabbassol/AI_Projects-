services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekis-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ekis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ekis -d ekis"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: