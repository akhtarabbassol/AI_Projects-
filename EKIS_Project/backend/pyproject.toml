[project]
name = "ekis-backend"
version = "0.1.0"
description = "EKIS Enterprise Knowledge Intelligence System Backend"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "PyJWT>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pydantic[email]>=2.8,<3.0",
    "langchain>=0.3,<2.0",
    "langchain-community>=0.3,<1.0",
    "langchain-text-splitters>=0.3,<2.0",
    "langchain-google-genai>=2.1,<3.0",
    "langchain-postgres>=0.0.12,<1.0",
    "pgvector>=0.3,<1.0",
    "langchain-huggingface>=0.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "alembic/versions",
]
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


