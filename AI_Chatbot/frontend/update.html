<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #1f2937;
            height: 100vh;
            overflow: hidden;
        }


        /* =========================
           MAIN LAYOUT
        ========================= */

        .app {
            display: flex;
            height: 100vh;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 260px;
            background: #171717;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }


        .new-chat {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }


        .new-chat:hover {
            background: #2a2a2a;
        }


        .history {
            margin-top: 25px;
            flex: 1;
            overflow-y: auto;
        }


        .history-title {
            color: #999;
            font-size: 12px;
            padding: 8px;
        }


        .history-item {
            padding: 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .history-item:hover {
            background: #2a2a2a;
        }


        .sidebar-footer {
            border-top: 1px solid #333;
            padding-top: 12px;
            color: #aaa;
            font-size: 13px;
        }


        /* =========================
           CHAT AREA
        ========================= */

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .top-bar {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            border-bottom: 1px solid #eee;
            font-size: 16px;
            font-weight: 600;
        }


        .model-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }


        /* =========================
           MESSAGES
        ========================= */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 140px;
        }


        .message-wrapper {
            max-width: 850px;
            margin: 0 auto 25px;
            display: flex;
        }


        .message-wrapper.user {
            justify-content: flex-end;
        }


        .message-wrapper.bot {
            justify-content: flex-start;
        }


        .message {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 15px;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
        }


        .user .message {
            background: #2f2f2f;
            color: white;
            border-bottom-right-radius: 5px;
        }


        .bot .message {
            background: #f1f1f1;
            color: #1f2937;
            border-bottom-left-radius: 5px;
        }


        /* =========================
           WELCOME SCREEN
        ========================= */

        .welcome {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-bottom: 80px;
        }


        .welcome h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }


        .welcome p {
            color: #777;
            font-size: 15px;
        }


        /* =========================
           INPUT AREA
        ========================= */

        .input-container {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            background: linear-gradient(
                transparent,
                white 30%
            );
            padding: 30px 20px 20px;
        }


        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: flex-end;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }


        #message {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            padding: 10px;
            font-size: 15px;
            min-height: 42px;
            max-height: 140px;
            font-family: inherit;
        }


        #sendButton {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }


        #sendButton:hover {
            background: #000;
        }


        #sendButton:disabled {
            background: #aaa;
            cursor: not-allowed;
        }


        .input-note {
            text-align: center;
            color: #999;
            font-size: 11px;
            margin-top: 8px;
        }


        /* =========================
           LOADING
        ========================= */

        .typing {
            display: flex;
            gap: 5px;
            padding: 5px;
        }


        .dot {
            width: 7px;
            height: 7px;
            background: #777;
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }


        .dot:nth-child(2) {
            animation-delay: .2s;
        }


        .dot:nth-child(3) {
            animation-delay: .4s;
        }


        @keyframes blink {

            0%, 80%, 100% {
                opacity: .3;
            }

            40% {
                opacity: 1;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }


            .input-container {
                left: 0;
            }


            .message {
                max-width: 90%;
            }


            .top-bar {
                padding-left: 15px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <button
            class="new-chat"
            onclick="newChat()"
        >

            + &nbsp; New chat

        </button>


        <div class="history">

            <div class="history-title">
                TODAY
            </div>

            <div id="historyList"></div>

        </div>


        <div class="sidebar-footer">

            AI Assistant

            <br>

            Powered by Gemini

        </div>

    </aside>



    <!-- =========================
         CHAT AREA
    ========================== -->

    <main class="chat-area">


        <header class="top-bar">

            <div class="model-name">

                <span class="status"></span>

                AI Assistant

            </div>

        </header>



        <!-- Messages -->

        <section id="messages">


            <div class="welcome" id="welcome">

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask me anything and I'll do my best to help.
                </p>

            </div>


        </section>



        <!-- Input -->

        <div class="input-container">


            <div class="input-box">


                <textarea
                    id="message"
                    placeholder="Message AI Assistant..."
                    rows="1"
                ></textarea>


                <button
                    id="sendButton"
                    onclick="sendMessage()"
                >

                    ↑

                </button>


            </div>


            <div class="input-note">

                AI can make mistakes. Check important information.

            </div>


        </div>


    </main>

</div>



<script>


const input =
    document.getElementById("message");


const button =
    document.getElementById("sendButton");


const messages =
    document.getElementById("messages");


const welcome =
    document.getElementById("welcome");


const historyList =
    document.getElementById("historyList");



/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    // Remove welcome screen

    if (welcome) {

        welcome.remove();

    }


    // Add user message

    addMessage(
        message,
        "user"
    );


    // Add history item

    addHistory(
        message
    );


    // Clear input

    input.value = "";


    // Reset textarea

    input.style.height = "auto";


    // Disable button

    button.disabled = true;


    // Show loading

    const loading =
        addLoading();


    try {


        const response =
            await fetch(
                "http://127.0.0.1:8000/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                }
            );


        const data =
            await response.json();


        // Remove loading

        loading.remove();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Something went wrong"
            );

        }


        // Add AI response

        addMessage(
            data.response,
            "bot"
        );


    }
    catch (error) {


        loading.remove();


        addMessage(
            "Sorry, I couldn't connect to the AI service.",
            "bot"
        );


        console.error(error);

    }
    finally {


        button.disabled = false;

        input.focus();

    }

}



/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    text,
    sender
) {


    const wrapper =
        document.createElement("div");


    wrapper.className =
        `message-wrapper ${sender}`;


    const message =
        document.createElement("div");


    message.className =
        "message";


    message.textContent =
        text;


    wrapper.appendChild(
        message
    );


    messages.appendChild(
        wrapper
    );


    messages.scrollTop =
        messages.scrollHeight;

}



/* =========================
   LOADING INDICATOR
========================= */

function addLoading() {


    const wrapper =
        document.createElement("div");


    wrapper.className =
        "message-wrapper bot";


    const message =
        document.createElement("div");


    message.className =
        "message";


    message.innerHTML = `

        <div class="typing">

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>

    `;


    wrapper.appendChild(
        message
    );


    messages.appendChild(
        wrapper
    );


    messages.scrollTop =
        messages.scrollHeight;


    return wrapper;

}



/* =========================
   CHAT HISTORY
========================= */

function addHistory(
    text
) {


    const item =
        document.createElement("div");


    item.className =
        "history-item";


    item.textContent =
        text;


    historyList.prepend(
        item
    );

}



/* =========================
   NEW CHAT
========================= */

function newChat() {


    messages.innerHTML = `

        <div class="welcome" id="welcome">

            <h1>
                How can I help you?
            </h1>

            <p>
                Ask me anything and I'll do my best to help.
            </p>

        </div>

    `;


    historyList.innerHTML = "";


    input.value = "";

    input.focus();

}



/* =========================
   ENTER / SHIFT + ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =========================
   AUTO RESIZE TEXTAREA
========================= */

input.addEventListener(
    "input",
    function() {


        this.style.height =
            "auto";


        this.style.height =
            Math.min(
                this.scrollHeight,
                140
            ) + "px";

    }
);


</script>


</body>

</html>
